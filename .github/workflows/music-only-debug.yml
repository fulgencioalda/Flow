name: Build Music-only APK and Source

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Test, build APK and package source
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install required Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;36.0.0"

      - name: Show build environment
        shell: bash
        run: |
          java -version
          ./gradlew --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-37"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

      - name: Make Gradle Wrapper executable
        run: chmod +x ./gradlew

      - name: Check formatting
        run: ./gradlew spotlessCheck --no-daemon --stacktrace

      - name: Run Github unit tests
        run: ./gradlew :app:testGithubDebugUnitTest --no-daemon --stacktrace

      - name: Run Foss unit tests
        run: ./gradlew :app:testFossDebugUnitTest --no-daemon --stacktrace

      - name: Build universal Github Debug APK
        run: ./gradlew :app:assembleGithubDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/github/debug/app-github-universal-debug.apk"
          test -f "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Create clean source ZIP
        shell: bash
        run: |
          mkdir -p artifacts
          zip -qr artifacts/flow-music-only-source.zip . \
            -x '.git/*' \
               '.gradle/*' \
               '**/build/*' \
               'local.properties' \
               'release.keystore' \
               'artifacts/*'
          unzip -t artifacts/flow-music-only-source.zip >/dev/null
          unzip -l artifacts/flow-music-only-source.zip | grep -q 'gradlew'
          unzip -l artifacts/flow-music-only-source.zip | grep -q '.github/workflows/music-only-debug.yml'
          ! unzip -l artifacts/flow-music-only-source.zip | grep -q 'local.properties'
          ls -lh artifacts/flow-music-only-source.zip
          sha256sum artifacts/flow-music-only-source.zip

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: flow-music-only-github-debug-universal
          path: app/build/outputs/apk/github/debug/app-github-universal-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload clean source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: flow-music-only-source
          path: artifacts/flow-music-only-source.zip
          if-no-files-found: error
          retention-days: 14
